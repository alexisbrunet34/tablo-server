services:
  ocr:
    build:
      context: .
      args:
        # PyTorch avec support GPU NVIDIA (CUDA 12.1).
        # Pour revenir au CPU : https://download.pytorch.org/whl/cpu (et commenter le bloc "deploy")
        TORCH_INDEX: https://download.pytorch.org/whl/cu121
    ports:
      - "8000:8000"
    environment:
      # Modèle de vision : Qwen2.5-VL-3B (léger) ou Qwen2.5-VL-7B (plus précis, ~16 Go de VRAM)
      VISION_MODEL: Qwen/Qwen2.5-VL-3B-Instruct
    # Conserve le modèle téléchargé entre deux redémarrages
    volumes:
      - hf-models:/root/.cache/huggingface
    restart: unless-stopped
    # Donne accès au GPU NVIDIA au conteneur
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-models:
