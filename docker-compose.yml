services:
  ocr:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Modèle TrOCR : trocr-base-handwritten (précis) ou trocr-small-handwritten (plus léger)
      TROCR_MODEL: microsoft/trocr-base-handwritten
    # Conserve les modèles téléchargés (PaddleOCR + Hugging Face) entre deux redémarrages
    volumes:
      - paddleocr-models:/root/.paddleocr
      - hf-models:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  paddleocr-models:
  hf-models:
