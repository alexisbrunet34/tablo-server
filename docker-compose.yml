services:
  ocr:
    build:
      context: .
      args:
        # CPU par défaut. Pour un GPU NVIDIA : https://download.pytorch.org/whl/cu121
        # (et décommenter le bloc "deploy" plus bas)
        TORCH_INDEX: https://download.pytorch.org/whl/cpu
    ports:
      - "8000:8000"
    environment:
      # Modèle de vision : Qwen2.5-VL-3B (léger) ou Qwen2.5-VL-7B (plus précis, plus lourd)
      VISION_MODEL: Qwen/Qwen2.5-VL-3B-Instruct
    # Conserve le modèle téléchargé entre deux redémarrages
    volumes:
      - hf-models:/root/.cache/huggingface
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

volumes:
  hf-models:
